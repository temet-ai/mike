name: Frontend quality

# Typecheck, unit tests and formatting run on every frontend push. Storybook runs
# on pull requests, a release candidate and on request.
on:
  pull_request:
    paths:
      - '.github/workflows/release-source-gates.yml'
      - 'scripts/tests/test_source_gate_routing.py'
      - 'frontend/**'
      - 'services/prompt-assistant/pnpm-lock.yaml'
      - 'scripts/likec4/pnpm-lock.yaml'
      - 'scripts/sb-test'
      - 'scripts/frontend-audit'
      - 'scripts/lib/frontend_audit.py'
      - 'scripts/tests/test_frontend_audit.py'
      - 'scripts/test-suite'
      - '.github/workflows/storybook.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'scripts/sb-test'
      - '.github/workflows/storybook.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: storybook-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Frontend typecheck, unit tests and formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend dependency advisory audit
        run: scripts/test-suite frontend-audit

      - name: Reject redundant visual unit tests
        run: node scripts/frontend-test-overlap.mjs --gate

      - name: Formatting
        working-directory: frontend
        run: pnpm exec prettier --check .

      - name: Typecheck and logic tests
        working-directory: frontend
        run: ../scripts/sb-test --unit --integration

  storybook:
    name: Storybook browser tests and build
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Storybook browser tests
        working-directory: frontend
        run: ../scripts/sb-test --storybook --skip-typecheck

      - name: Storybook build
        working-directory: frontend
        run: pnpm run storybook:build
