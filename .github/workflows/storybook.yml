name: Frontend quality

# PR and main routing are path-filtered; explicit candidate/manual runs are not.
on:
  pull_request:
    paths:
      - '.github/workflows/release-source-gates.yml'
      - 'scripts/tests/test_source_gate_routing.py'
      - 'frontend/**'
      - 'services/prompt-assistant/pnpm-lock.yaml'
      - 'scripts/likec4/pnpm-lock.yaml'
      - 'scripts/sb-test'
      - 'scripts/frontend-audit'
      - 'scripts/lib/frontend_audit.py'
      - 'scripts/tests/test_frontend_audit.py'
      - 'scripts/test-suite'
      - '.github/workflows/storybook.yml'
  push:
    branches: [main]
    paths-ignore:
      - 'crates/**'
      - '.sqlx/**'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: storybook-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Frontend tests and Storybook build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend dependency advisory audit
        run: scripts/test-suite frontend-audit

      - name: Install Playwright chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Reject redundant visual unit tests
        run: node scripts/frontend-test-overlap.mjs --gate

      - name: Typecheck, logic tests, and Storybook browser tests
        working-directory: frontend
        run: ../scripts/sb-test

      - name: Storybook build
        working-directory: frontend
        run: pnpm run storybook:build
