name: Capture or runtime problem
description: Report a non-sensitive capture, browser, MCP, or restart problem.
title: "[runtime] "
body:
  - type: markdown
    attributes:
      value: |
        These issues may be public. Use only synthetic, non-sensitive examples.
        Never include .env files, full environment output, prompts, conversation dumps,
        request headers, tokens, credentials, full database URLs, or sensitive paths.
        Do not attach raw logs, screenshots, or support bundles without reviewing them.
        Security vulnerabilities belong in a verified private reporting channel, not here.
        See the [pilot feedback guide](https://github.com/temet-ai/mike/blob/main/docs/PILOT_FEEDBACK.md#security-reports)
        for the reporting boundary and what to do if no private channel is available.
  - type: checkboxes
    id: safety
    attributes:
      label: Before submitting
      options:
        - label: I reviewed every field and attachment for private data and secrets.
          required: true
        - label: This is an ordinary product problem, not a security vulnerability report.
          required: true
  - type: input
    id: version
    attributes:
      label: Version or build identity
      description: Release label, archive filename, or source commit; use unknown if unavailable. No private download links.
      placeholder: "Example: source commit abc1234; or unknown"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system, OS version, and CPU architecture only.
      placeholder: "Example: macOS 15, arm64"
    validations:
      required: true
  - type: dropdown
    id: storage
    attributes:
      label: Storage method
      description: Method only; no database URL, hostname, username, password, or local path.
      options:
        - Trial / in-memory (ephemeral)
        - Docker PostgreSQL
        - Existing PostgreSQL (including user-managed native or Homebrew)
        - Not configured yet
        - Other or unknown
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected workflow
      options:
        - mike claude wrapper
        - Standalone Anthropic-compatible proxy
        - Embedded browser UI
        - mike-mcp
        - Startup / shutdown / restart
        - Other or unknown
    validations:
      required: true
  - type: dropdown
    id: daemon_state
    attributes:
      label: Observed daemon state
      description: Choose only what you observed; use unknown if no safe status check was available.
      options:
        - Stopped
        - Degraded or failing
        - Ready
        - Unknown
    validations:
      required: true
  - type: dropdown
    id: capture_expectation
    attributes:
      label: Was new capture expected?
      description: Idle time alone is not a capture failure. For a standalone client, check locally whether it sends a valid x-claude-code-session-id; do not copy the header value here.
      options:
        - Yes, I deliberately sent a synthetic request through mike
        - No, the client was idle
        - Not a capture problem
        - Unknown
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What did you try?
      description: Describe the workflow in your own words, using synthetic names.
      placeholder: "Example: restarted a disposable trial instance after a synthetic capture."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: "Example: the UI would explain that trial history is lost on restart."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
      description: Summarize the result and any error code or exit status; no raw command output.
      placeholder: "Example: history was empty after restart and I could not find a trial warning."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproducible non-sensitive example
      description: Numbered steps using disposable test data. If reproduction needs private data, say cannot share safely.
      placeholder: |
        1. Start a disposable trial instance.
        2. Generate one synthetic capture, then stop and restart the instance.
        3. Check whether the UI explains the empty history.
        This is a synthetic example, not evidence of an existing bug.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Safe diagnostic summary (optional)
      description: Error codes, exit statuses, prerequisite availability, and coarse config source (defaults, environment, CLI, or saved settings) only. Review before sharing.
      placeholder: "Example: client version: unknown; config source: defaults; process was stopped then ready."
