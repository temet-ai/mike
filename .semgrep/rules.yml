# The push hook's semgrep rules (scripts/semgrep-new reads this file; no registry
# download). Each rule covers a risk clippy, cargo-deny, ruff and shellcheck do
# not see: TLS settings, predictable temp paths, new unsafe code, SQL and shell
# command lines built from values, and the frontend's HTML and code sinks.
# Bash and Python cover scripts/ (extensionless scripts are scanned by shebang).
rules:
  - id: mike.rust.unsafe
    languages: [rust]
    severity: WARNING
    message: >-
      New unsafe code. Use a safe wrapper instead (rustix for libc calls, std's
      File::try_lock for flock); if none exists, say why in the commit message.
    pattern-either:
      - pattern-regex: '\bunsafe\s*\{[^{}\n]*\}?'
      - pattern-regex: '\bunsafe\s+(fn|impl|extern|trait)\b[^{;\n]*'

  - id: mike.rust.temp-dir
    languages: [rust]
    severity: WARNING
    message: >-
      A path under the shared temp directory can be predicted and pre-created by
      another user. Use tempfile::tempdir() or a private per-user directory.
    pattern-regex: '\btemp_dir\(\)'

  - id: mike.rust.tls-verification-off
    languages: [rust]
    severity: ERROR
    message: Certificate or hostname verification is turned off.
    pattern-either:
      - pattern: $B.danger_accept_invalid_certs(true)
      - pattern: $B.danger_accept_invalid_hostnames(true)
      - pattern: $B.dangerous()
      - pattern: SslVerifyMode::NONE
      - pattern: openssl::ssl::SslVerifyMode::NONE

  - id: mike.rust.weak-hash
    languages: [rust]
    severity: WARNING
    message: MD5 and SHA-1 are broken; use sha2 (already a dependency).
    pattern-regex: '\b(md5|sha1|Md5|Sha1)::'

  - id: mike.js.eval
    languages: [javascript, typescript]
    severity: ERROR
    message: Code built from a value is executed.
    pattern-either:
      - patterns:
          - pattern: eval($X)
          - pattern-not: eval("...")
      - pattern: new Function(...)

  - id: mike.js.html-sink
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      A value is written into the page as HTML. Captured traffic is untrusted;
      render it as text or sanitise it first.
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $E.innerHTML = $X
              - pattern: $E.outerHTML = $X
          - pattern-not: $E.$P = "..."
      - pattern: $E.insertAdjacentHTML(...)
      - pattern: document.write(...)

  - id: mike.svelte.raw-html
    languages: [generic]
    severity: WARNING
    message: >-
      {@html} renders a value as HTML. Captured traffic is untrusted; render it as
      text or sanitise it first.
    paths:
      include: ["*.svelte"]
    pattern-regex: '\{@html\s'

  - id: mike.js.postmessage-wildcard
    languages: [javascript, typescript]
    severity: WARNING
    message: postMessage to any origin; name the target origin.
    pattern: $W.postMessage($M, "*")

  - id: mike.js.tls-verification-off
    languages: [javascript, typescript]
    severity: ERROR
    message: Certificate verification is turned off.
    pattern-either:
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = $V
      - pattern: '{..., rejectUnauthorized: false, ...}'

  - id: mike.js.shell-command
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      A shell command is built from a value. Pass an argument list to
      execFile/spawn without shell: true.
    pattern-either:
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      import { ..., exec, ... } from "$M"
                      ...
                  - pattern: exec($CMD, ...)
              - patterns:
                  - pattern-inside: |
                      import { ..., execSync, ... } from "$M"
                      ...
                  - pattern: execSync($CMD, ...)
              - patterns:
                  - pattern-inside: |
                      import * as $CP from "$M"
                      ...
                  - pattern-either:
                      - pattern: $CP.exec($CMD, ...)
                      - pattern: $CP.execSync($CMD, ...)
              - pattern-either:
                  - pattern: require("$M").exec($CMD, ...)
                  - pattern: require("$M").execSync($CMD, ...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(node:)?child_process$
          - metavariable-pattern:
              metavariable: $CMD
              patterns:
                - pattern-not: '"..."'
      - pattern: '$F(..., {..., shell: true, ...})'

  - id: mike.rust.sql-from-string
    languages: [rust]
    severity: WARNING
    message: >-
      SQL is built from a runtime string, so sqlx's literal-only check is
      switched off. Use query!/query_as! or a literal with bind parameters.
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: AssertSqlSafe($X)
              - pattern: sqlx::AssertSqlSafe($X)
          - pattern-not: AssertSqlSafe("...")
          - pattern-not: sqlx::AssertSqlSafe("...")
      - patterns:
          - pattern: sqlx::raw_sql($X)
          - pattern-not: sqlx::raw_sql("...")

  - id: mike.rust.shell-command
    languages: [rust]
    mode: taint
    severity: ERROR
    message: >-
      A shell command line is built from a formatted or outside value. Run the
      program directly with Command::new(program).args(list).
    pattern-sources:
      - pattern: format!(...)
      - pattern: std::env::var(...)
      - pattern: std::env::args()
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $C.arg("-c").arg($X)
              - pattern: $C.args(["-c", $X])
          - focus-metavariable: $X

  - id: mike.python.shell-command
    languages: [python]
    mode: taint
    severity: ERROR
    message: >-
      A shell command line is built from an outside value (arguments,
      environment, input or parsed data). Pass an argument list without
      shell=True, or quote it with shlex.quote.
    pattern-sources:
      - pattern: sys.argv
      - pattern: os.environ
      - pattern: os.environ.get(...)
      - pattern: os.getenv(...)
      - pattern: input(...)
      - pattern: json.load(...)
      - pattern: json.loads(...)
      - pattern: $P.parse_args(...)
    pattern-sanitizers:
      - pattern: shlex.quote(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: subprocess.$F($X, ..., shell=True, ...)
              - pattern: os.system($X)
              - pattern: os.popen($X, ...)
          - focus-metavariable: $X

  - id: mike.python.code-from-value
    languages: [python]
    severity: ERROR
    message: Code or objects are built from a value (eval, exec, pickle, yaml.load).
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: eval($X, ...)
              - pattern: exec($X, ...)
          - pattern-not: eval("...", ...)
          - pattern-not: exec("...", ...)
      - pattern: pickle.load(...)
      - pattern: pickle.loads(...)
      - patterns:
          - pattern: yaml.load(...)
          - pattern-not: yaml.load(..., Loader=yaml.SafeLoader, ...)
          - pattern-not: yaml.load(..., Loader=yaml.CSafeLoader, ...)

  - id: mike.python.tls-verification-off
    languages: [python]
    severity: ERROR
    message: Certificate verification is turned off.
    pattern-either:
      - pattern: $F(..., verify=False, ...)
      - pattern: ssl._create_unverified_context(...)
      - pattern: $CTX.verify_mode = ssl.CERT_NONE

  - id: mike.python.temp-path
    languages: [python]
    severity: WARNING
    message: >-
      tempfile.mktemp names a file another user can create first. Use
      tempfile.mkstemp, NamedTemporaryFile or TemporaryDirectory.
    pattern: tempfile.mktemp(...)

  - id: mike.shared-tmp-path
    languages: [generic]
    paths:
      include: ["*.sh", "*.bash", "*.py"]
    severity: WARNING
    message: >-
      A fixed name under /tmp can be predicted and pre-created by another user.
      Use mktemp (or tempfile), $XDG_RUNTIME_DIR or a per-user state directory.
    pattern-regex: '(?<![\w$.{-])/tmp/(?![\w.-]*XXX)[\w.-]*[A-Za-z0-9_]'

  - id: mike.bash.download-into-shell
    languages: [generic]
    paths:
      include: ["*.sh", "*.bash"]
    severity: ERROR
    message: A download is piped straight into a shell; download, check, then run it.
    pattern-regex: '\b(curl|wget)\b[^|\n]*\|\s*(sudo\s+)?(ba|z)?sh\b'

  - id: mike.bash.eval
    languages: [generic]
    paths:
      include: ["*.sh", "*.bash"]
    severity: WARNING
    message: >-
      eval runs a string as shell code; build an array and run "${cmd[@]}"
      instead.
    pattern-regex: '(^|[;&|({]\s*|\bthen\s+|\bdo\s+)eval\s'

  - id: mike.bash.tls-verification-off
    languages: [generic]
    paths:
      include: ["*.sh", "*.bash"]
    severity: ERROR
    message: Certificate verification is turned off.
    pattern-regex: '\b(curl\b[^\n]*\s(-k|--insecure)\b|wget\b[^\n]*\s--no-check-certificate\b)'

  - id: mike.svelte.script-sink
    languages: [generic]
    severity: WARNING
    message: >-
      A script block in a component executes or writes HTML from a value
      (innerHTML, insertAdjacentHTML, document.write, eval, new Function) or
      posts to any origin. Render text, or sanitise first.
    paths:
      include: ["*.svelte"]
    pattern-either:
      - pattern-regex: '\.(inner|outer)HTML\s*=(?!=)(?!\s*["''`][^"''`$]*["''`]\s*;?\s*$)'
      - pattern-regex: '\b(insertAdjacentHTML|document\.write)\s*\('
      - pattern-regex: '(?<![\w.])eval\s*\((?!\s*["''][^"'']*["'']\s*\))'
      - pattern-regex: '\bnew\s+Function\s*\('
      - pattern-regex: '\.postMessage\([^)]*,\s*["'']\*["'']'

  - id: mike.bidi-control-character
    languages: [generic]
    severity: ERROR
    message: >-
      A bidirectional control character can make code read differently from how
      it runs (Trojan Source).
    pattern-regex: "[‪-‮⁦-⁩]"
