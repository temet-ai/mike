[package]
name = "mike"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false  # private binary, never published; satisfies cargo-deny licenses.private
autotests = false

# `publish = false` hides a package from cargo-dist by default; this crate
# still ships prebuilt GitHub Release + Homebrew artifacts (see docs/RELEASING.md).
[package.metadata.dist]
dist = true

[[bin]]
name = "mike"
path = "src/main.rs"

[features]
# Default: no test-only seams compiled into the release binary.
default = []
# `test-seams` exposes integration-test-only entry points
# (e.g. `register_for_tests` in `crate::in_flight`) that must NOT
# ship in production binaries. Integration tests opt in by setting
# `--features test-seams`. Keeps `nm target/release/mike`
# free of test-seam symbols by default.
test-seams = ["mike-base/test-seams", "mike-features/test-seams"]
# `ts-export` derives `ts_rs::TS` on the inspect-API response DTOs so the
# frontend's TypeScript bindings are GENERATED from the Rust producers
# instead of hand-authored beside them. Off by default — normal/release
# builds never compile `ts-rs`. Regenerate with:
#   cargo test -p mike --features ts-export export_bindings
ts-export = ["dep:ts-rs", "mike-base/ts-export", "mike-features/ts-export"]

[dependencies]
mike-base = { path = "../mike-base" }
mike-features = { path = "../mike-features" }
anyhow = { workspace = true }
arc-swap = "1"
async-trait = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
bytes = { workspace = true }
bytesize = { workspace = true }
chrono = { workspace = true }
clap = { version = "4", features = ["derive"] }
# TUI control center (temet-ai/mike-private#50). Only mike consumes these, so they stay direct
# crate deps rather than a workspace.dependencies entry, matching rust-embed
# below. ratatui and crossterm move together — ratatui re-exports the crossterm
# event types the TUI matches on, so a mismatched pair compiles two crossterms
# and the types stop lining up.
crossterm = "0.29"
ratatui = "0.30"
dashmap = { workspace = true }
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }
directories = { workspace = true }
dotenvy = "0.15"
eventsource-stream = "0.2"
figment = { workspace = true }
futures = "0.3"
hex = { workspace = true }
http-body-util = "0.1"
humantime = { workspace = true }
# Phase 1 — memory attribution. `getrusage(RUSAGE_SELF)` for peak RSS
# in `crate::diagnostics::rss`. Already a transitive dep through tokio
# / sqlx; explicit here is cheaper than peeling those features apart.
libc = "0.2"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
mike-codex = { path = "../mike-codex" }
rustix = { version = "1.1.6", features = ["process", "fs"] }
# Embeds the built SvelteKit SPA (`frontend/build/`) into the binary for
# the third (SPA) bind — see `src/spa.rs` and `build.rs`. Only `mike`
# consumes this, so it stays a direct crate dep rather than a
# `[workspace.dependencies]` entry.
mime_guess = "2"
# The TLS-MITM sidecar, run from this binary as `mike forward`; also the single
# source of the sidecar CA's location.
proxy-forward = { path = "../proxy-forward" }
regex = "1"
reqwest = { workspace = true }
rust-embed = "8"
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
similar = { workspace = true }
sqlx = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
toml = "1.1"
toml_edit = { workspace = true }
# Already present in the build graph transitively (via reqwest); promoted to
# a direct dep so the mailbox `context` XSS guard (kind:url must be http(s))
# parses with a real URL grammar instead of a hand-rolled prefix check. Only
# mike consumes this, so it stays a direct crate dep per the workspace's
# single-consumer convention (see `mime_guess`/`crossterm` above).
url = "2"
# Optional: only compiled under `--features ts-export` (the Rust→TS type
# generator). Default builds never pull it in. `no-serde-warnings` silences
# the build-time advice about serde attrs ts-rs can't fully model; the DTOs
# annotate any foreign field types explicitly via `#[ts(type = "...")]`.
ts-rs = { version = "12", optional = true, features = ["no-serde-warnings"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["compression-gzip", "cors", "request-id", "timeout", "trace"] }
tracing = { workspace = true }
tracing-opentelemetry = "0.33"
tracing-appender = "0.2"
tracing-subscriber = { workspace = true, features = ["json"] }
opentelemetry = { version = "0.32", features = ["trace"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "trace"] }
uuid = { workspace = true }

[dev-dependencies]
# Self-dep with `test-seams` enables the cfg-gated integration-test seams
# (`crate::in_flight::register_for_tests`) without requiring callers to
# pass `--features test-seams` on the cargo test command line.
mike = { path = ".", features = ["test-seams"] }
nix = { version = "0.29.0", default-features = false, features = ["user"] }
futures = "0.3"
insta = { version = "1", features = ["json"] }
proptest = "1"
proptest-derive = "0.8"
serial_test = { version = "4", default-features = false }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
wiremock = "0.6"

# Test source stays split by concern while Cargo compiles and links one harness
# per execution tier. `autotests = false` prevents concern files and helpers
# from accidentally becoming standalone binaries.
[[test]]
name = "proxy"
path = "tests/proxy.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "e2e"
path = "tests/e2e.rs"

[[test]]
name = "cli"
path = "tests/cli.rs"

[[test]]
name = "schema"
path = "tests/schema.rs"

[[test]]
name = "reminder_on_token"
path = "tests/reminder_on_token.rs"

[[test]]
name = "release_contracts"
path = "tests/release_contracts.rs"

[[test]]
name = "provider_setup_contracts"
path = "tests/provider_setup_contracts.rs"

[[test]]
name = "stalled_stream_contracts"
path = "tests/stalled_stream_contracts.rs"

[[test]]
name = "release_preflight"
path = "tests/release_preflight.rs"


[[test]]
name = "doctor_database_contracts"
path = "tests/doctor_database_contracts.rs"
required-features = ["test-seams"]
