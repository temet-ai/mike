id: rust-no-comments
url: '.claude/rules/rust-database-reliability.md#rust'
language: rust
severity: warning
rule:
  any:
    - kind: line_comment
    - kind: block_comment
  not:
    regex: 'grader-allow:'
message: Rust files carry no comments, doc comments, disabled code or TODOs. Say it with names, types and tests; put the reason in the commit message.
---
id: rust-log-field-names
url: 'scripts/lint-rust-log-fields'
language: rust
severity: error
rule:
  all:
    - kind: macro_invocation
    - regex: '^(tracing::)?(trace|debug|info|warn|error|event)!'
    - any:
        - regex: '[(,]\s*[%?](e|err|session|session_uuid)\s*[,)]'
        - regex: '(^|[^\w.])(err|session|session_uuid)\s*=\s*[%?]'
message: Log fields use the shared names; write an error as `error = %e` and a session as `session_id = %id`. scripts/lint-rust-log-fields fails the push otherwise.
---
id: rust-lint-suppression
url: 'scripts/lint-rust-suppressions'
language: rust
severity: error
rule:
  any:
    - kind: attribute_item
    - kind: inner_attribute_item
  regex: '(allow|expect)\s*\(.*(clippy::(all|complexity|pedantic|restriction|cognitive_complexity|too_many_arguments|too_many_lines)|warnings)'
message: Structural lint suppressions are refused at push (scripts/lint-rust-suppressions). Split the function or module instead.
---
id: rust-unsafe
language: rust
severity: warning
rule:
  kind: unsafe_block
message: New unsafe code. Use a safe wrapper (rustix or nix for libc calls); if none exists, say why in the commit message.
---
id: rust-temp-dir
language: rust
severity: warning
rule:
  kind: call_expression
  regex: '(^|::)temp_dir\(\)$'
message: A path under the shared temp directory can be predicted and pre-created by another user. Use tempfile::tempdir() or a private per-user directory.
---
id: rust-tls-verification-off
language: rust
severity: error
rule:
  any:
    - pattern: $B.danger_accept_invalid_certs(true)
    - pattern: $B.danger_accept_invalid_hostnames(true)
message: Certificate or hostname verification is turned off.
---
id: rust-shell-from-format
language: rust
severity: warning
rule:
  pattern: $C.arg("-c").arg(format!($$$A))
message: A shell command line is built with format!. Run the program directly with Command::new(program).args(list).
---
id: rust-ignore-needs-reason
url: '.claude/rules/rust-database-reliability.md#tests'
language: rust
severity: warning
rule:
  kind: attribute_item
  regex: '^#\[ignore\]$'
message: '#[ignore] needs a reason: write #[ignore = "why"].'
fix: '#[ignore = "why"]'
---
id: rust-too-many-arguments
url: 'scripts/lint-rust'
language: rust
severity: error
rule:
  kind: parameters
  inside:
    kind: function_item
  has:
    any:
      - kind: parameter
      - kind: self_parameter
    nthChild: 7
  not:
    inside:
      kind: impl_item
      stopBy: end
      has:
        field: trait
        regex: '.'
message: This function takes more than 6 arguments; clippy::too_many_arguments fails the push (scripts/lint-rust). Group related arguments into a struct.
---
id: rust-file-too-long
url: 'scripts/lint-rust-size'
language: rust
severity: error
rule:
  kind: source_file
  regex: '^(?:[^\n]*\n){500}[\s\S]'
message: This file is over 500 lines; scripts/lint-rust-size fails the push. Split it into modules by responsibility.
