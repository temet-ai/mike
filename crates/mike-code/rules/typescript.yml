id: ts-eval
language: typescript
severity: error
rule:
  any:
    - pattern: eval($X)
    - pattern: new Function($$$)
constraints:
  X:
    not:
      kind: string
message: Code built from a value is executed.
---
id: ts-html-sink
language: typescript
severity: warning
rule:
  any:
    - pattern: $E.innerHTML = $X
    - pattern: $E.outerHTML = $X
    - pattern: $E.insertAdjacentHTML($P, $X)
    - pattern: document.write($X)
constraints:
  X:
    not:
      any:
        - kind: string
        - all:
            - kind: template_string
            - not:
                has:
                  kind: template_substitution
                  not:
                    has:
                      kind: call_expression
                      has:
                        field: function
                        regex: '^(esc|escape|escapeHtml|escapeHTML)$'
message: A value is written into the page as HTML. Render it as text, or sanitise it first if any part can come from outside.
---
id: ts-tls-verification-off
language: typescript
severity: error
rule:
  any:
    - kind: pair
      regex: '^rejectUnauthorized\s*:\s*false$'
    - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = $V
message: Certificate verification is turned off.
