:#ff2e88" opacity="0"><animate attributeName="opacity" dur="22.6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.461;0.465;0.572;0.575;1"/></path><path d="M513,200 H615 V258 L607,266 H505 V208 Z" fill="none" stroke="#ff2e88" stroke-width="2" class="glow" style="color:#ff2e88" opacity="0"><animate attributeName="opacity" dur="22.6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.59;0.594;0.701;0.704;1"/></path><path d="M393,200 H495 V258 L487,266 H385 V208 Z" fill="none" stroke="#57657a" stroke-width="2" class="glow" style="color:#57657a" opacity="0"><animate attributeName="opacity" dur="22.6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.719;0.723;0.731;0.734;1"/></path><path d="M273,200 H375 V258 L367,266 H265 V208 Z" fill="none" stroke="#57657a" stroke-width="2" class="glow" style="color:#57657a" opacity="0"><animate attributeName="opacity" dur="22.6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.736;0.74;0.747;0.751;1"/></path><path d="M153,200 H255 V258 L247,266 H145 V208 Z" fill="none" stroke="#57657a" stroke-width="2" class="glow" style="color:#57657a" opacity="0"><animate attributeName="opacity" dur="22.6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.753;0.757;0.764;0.768;1"/></path><path d="M33,200 H135 V258 L127,266 H25 V208 Z" fill="none" stroke="#d97757" stroke-width="2" class="glow" style="color:#d97757" opacity="0"><animate attributeName="opacity" dur="22.6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.77;0.773;0.982;0.986;1"/></path><path d="M20,284 H990 V454 L980,464 H10 V294 Z" fill="#14181e" stroke="#333d4b"/><line x1="500" y1="292" x2="500" y2="456" stroke="#333d4b"/><text x="26" y="308" class="sm" style="font-weight:700;letter-spacing:1.5px;fill:#4d8dff">CAPTURED · stored_body</text><text x="26" y="324" class="xs">logical inbound capture · body APIs expose fidelity</text><text x="26" y="344" class="xs">system[0..1]</text><text x="144" y="344" class="sm">&quot;You are Claude Code…&quot;, &lt;env&gt;</text><text x="26" y="360" class="xs">system[2]</text><text x="144" y="360" class="sm">&quot;# CLAUDE.md (project rules)&quot;</text><text x="26" y="376" class="xs">messages[0..4]</text><text x="144" y="376" class="sm">repeated Read + recall-tag history</text><text x="26" y="392" class="xs">messages[5]</text><text x="144" y="392" class="sm">user: &quot;run it again&quot;</text><text x="26" y="408" class="xs">tools</text><text x="144" y="408" class="sm">[Bash, Read, Edit, …]</text><text x="516" y="308" class="sm" style="font-weight:700;letter-spacing:1.5px;fill:#ff2e88">FORWARDED UPSTREAM</text><text x="516" y="324" class="xs">whatever the last stage to fire produced</text><text x="516" y="344" class="xs">system[0..1]</text><text x="634" y="344" class="sm">&quot;You are Claude Code…&quot;, &lt;env&gt;</text><text x="516" y="360" class="xs">system[2]</text><text x="634" y="360" class="sm">&quot;# CLAUDE.md (project rules)&quot;</text><text x="516" y="376" class="xs">messages[0..4]</text><text x="634" y="376" class="sm">repeated Read + recall-tag history</text><text x="516" y="392" class="xs">messages[5]</text><text x="634" y="392" class="sm">user: &quot;run it again&quot;</text><text x="516" y="408" class="xs">tools</text><text x="634" y="408" class="sm">[Bash, Read, Edit, …]</text><g opacity="0"><animate attributeName="opacity" dur="22.6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.149;0.155;0.98;0.986;1"/><rect x="512" y="415" width="470" height="14" fill="#2a1420"/><text x="516" y="426" class="xs" style="fill:#ff2e88">recall_injector</text><text x="634" y="426" class="sm" style="fill:#dae1ea">+ &lt;system-reminder&gt; recalled lessons</text></g><g opacity="0"><animate attributeName="opacity" dur="22.6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.345;0.351;0.98;0.986;1"/><rect x="512" y="430" width="470" height="14" fill="#2a1420"/><text x="516" y="441" class="xs" style="fill:#ff2e88">reminders</text><text x="634" y="441" class="sm" style="fill:#dae1ea">+ queued reminders</text></g><g opacity="0"><animate attributeName="opacity" dur="22.6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.474;0.481;0.98;0.986;1"/><rect x="512" y="445" width="470" height="14" fill="#2a1420"/><text x="516" y="456" class="xs" style="fill:#ff2e88">steerer</text><text x="634" y="456" class="sm" style="fill:#dae1ea">+ &lt;system-reminder&gt; steerer note</text></g><g opacity="0"><animate attributeName="opacity" dur="22.6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.604;0.61;0.98;0.986;1"/><rect x="512" y="365" width="470" height="14" fill="#2a1420"/><text x="516" y="376" class="xs" style="fill:#ff2e88">messages[0..4]</text><text x="634" y="376" class="sm" style="fill:#dae1ea">history + dedup stub</text></g><g opacity="0"><animate attributeName="opacity" dur="22.6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.788;0.794;0.98;0.986;1"/><text x="484" y="308" text-anchor="end" class="sm" style="fill:#2ee56b;font-weight:700">unchanged</text><text x="974" y="308" text-anchor="end" class="sm" style="fill:#ff2e88;font-weight:700">4 stages fired · differs</text></g><g><animateMotion dur="22.6s" repeatCount="indefinite" path="M80,63 L200,63 L320,63 L440,63 L560,63 L680,63 L800,63 L920,63 L920,233 L800,233 L680,233 L560,233 L440,233 L320,233 L200,233 L80,233" keyPoints="0;0;0.065;0.13;0.195;0.259;0.259;0.324;0.389;0.454;0.546;0.611;0.611;0.676;0.676;0.741;0.741;0.805;0.87;0.935;1;1;1" keyTimes="0;0.071;0.085;0.102;0.119;0.135;0.25;0.265;0.281;0.298;0.315;0.332;0.447;0.461;0.576;0.59;0.705;0.719;0.736;0.753;0.77;0.991;1" calcMode="linear"/><circle r="11" fill="#22d9ff" opacity="0.22"/><circle r="5.5" fill="#22d9ff"/></g></g><line x1="0" y1="528" x2="1000" y2="528" stroke="#333d4b"/><g opacity="0"><animate attributeName="opacity" dur="22.6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.013;0.019;0.069;0.075;1"/><text x="24" y="555" class="cn">STAGE</text><text x="110" y="555" class="ct">accept</text><text x="110" y="577" class="cx">stored_body = the original inbound bytes, captured before any stage runs.</text><text x="110" y="594" class="cx">This copy is what the inspect API and mike-mcp serve, whatever happens next.</text></g><g opacity="0"><animate attributeName="opacity" dur="22.6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.135;0.142;0.248;0.254;1"/><text x="24" y="555" class="cn">STAGE</text><text x="110" y="555" class="ct">recall_injector · armed</text><text x="110" y="577" class="cx">Gate: recall_injector toggle (default off). Injects recalled context from earlier turns,</text><text x="110" y="594" class="cx">when the configured recall trigger is present (for example mem:recall), through a JSON round-trip.</text></g><g opacity="0"><animate attributeName="opacity" dur="22.6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.332;0.338;0.445;0.451;1"/><text x="24" y="555" class="cn">STAGE</text><text x="110" y="555" class="ct">reminders · armed</text><text x="110" y="577" class="cx">Gate: reminders toggle (default off). Appends queued reminders, same serde_json round-trip.</text></g><g opacity="0"><animate attributeName="opacity" dur="22.6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.461;0.467;0.574;0.58;1"/><text x="24" y="555" class="cn">STAGE</text><text x="110" y="555" class="ct">primary-lane queue drain</text><text x="110" y="577" class="cx">The drain runs on primary lanes. InjectionGate checks each source; only steerer-origin notes</text><text x="110" y="594" class="cx">require the steerer toggle. Explicitly authored mailbox messages use their own delivery gate.</text></g><g opacity="0"><animate attributeName="opacity" dur="22.6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.59;0.596;0.703;0.709;1"/><text x="24" y="555" class="cn">STAGE</text><text x="110" y="555" class="ct">read_dedup · armed</text><text x="110" y="577" class="cx">Gate: compression_dedup.enabled (default off). Repeated Read results become forwarded-only stubs;</text><text x="110" y="594" class="cx">the logical inbound capture keeps the original tool-result text.</text></g><g opacity="0"><animate attributeName="opacity" dur="22.6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.77;0.776;0.989;0.995;1"/><text x="24" y="555" class="cn">STAGE</text><text x="110" y="555" class="ct">upstream</text><text x="110" y="577" class="cx">Capture admission → Phase-1 stub → send. The forwarded body differs from the capture;</text><text x="110" y="594" class="cx">the logical inbound capture never changed. Other stages did not rewrite in this example.</text></g><rect x="0" y="618" width="0" height="3" fill="#22d9ff" opacity="0.7"><animate attributeName="width" dur="22.6s" repeatCount="indefinite" values="0;1000" keyTimes="0;1"/></rect>
</svg>
