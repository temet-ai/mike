<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 624" width="1000" height="624" role="img" aria-labelledby="t d">
<title id="t">mike request pipeline, animated</title>
<desc id="d">Animated diagram of pipeline::STAGE_ORDER. A request packet passes accept, then filter, reminder_on_token, lazy_sections, recall_injector, lessons, self_identity, workspace_briefing, agent_lessons, reminders, the steerer queue drain, read_dedup, file_read_compression, proxy_tools and the composer, then goes upstream. In this primary-turn example recall_injector, reminders, the queue drain and read_dedup rewrite the forwarded body; the logical inbound capture never changes.</desc>
<style>
text { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.nl { font-size: 13px; font-weight: 600; }
.ns { font-size: 10.5px; }
.pl { font-size: 11px; font-weight: 600; paint-order: stroke; stroke: #0e1116; stroke-width: 4px; stroke-linejoin: round; }
.wl { font-size: 10.5px; fill: #b6c1cf; paint-order: stroke; stroke: #0e1116; stroke-width: 4px; }
.eb { font-size: 10.5px; letter-spacing: 2px; fill: #22d9ff; }
.hd { font-family: 'Syne', 'Avenir Next', 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 19px; font-weight: 700; fill: #dae1ea; }
.cn { font-size: 11px; fill: #22d9ff; }
.ct { font-size: 13.5px; font-weight: 700; fill: #dae1ea; }
.cx { font-size: 12px; fill: #b6c1cf; }
.sm { font-size: 11px; fill: #b6c1cf; }
.xs { font-size: 10px; fill: #8b95a4; }
.wire { fill: none; stroke: #57657a; stroke-width: 1.4; stroke-dasharray: 3 5; opacity: 0.6; }
.live { fill: none; stroke-width: 2; stroke-dasharray: 7 6; animation: march 0.5s linear infinite; }
.live.rev { animation-direction: reverse; }
.lit { fill: none; stroke-width: 1.5; }
.glow { filter: drop-shadow(0 0 6px currentColor); }
@keyframes march { to { stroke-dashoffset: -13; } }
</style>
