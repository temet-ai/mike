<text x="24" y="24" class="eb">MIKE · HOW IT WORKS</text>
<text x="24" y="46" class="hd">Request pipeline: an example with four active rewrite paths</text>
<g transform="translate(0,58)"><text x="25" y="20" class="xs">stages_before_steerer() →</text><text x="975" y="190" text-anchor="end" class="xs">← stages_after_steerer(), then the composer</text><path d="M80,63 L200,63 L320,63 L440,63 L560,63 L680,63 L800,63 L920,63 L920,233 L800,233 L680,233 L560,233 L440,233 L320,233 L200,233 L80,233" fill="none" stroke="#57657a" stroke-width="1.4" stroke-dasharray="3 5" opacity="0.6"/><path d="M33,30 H135 V88 L127,96 H25 V38 Z" fill="#152a20" stroke="#2b7a52" stroke-width="1.2"/><text x="80" y="57" text-anchor="middle" class="nl" fill="#5fe0a0">accept</text><text x="80" y="74" text-anchor="middle" class="ns" fill="#8b95a4">keeps inbound</text><path d="M153,30 H255 V88 L247,96 H145 V38 Z" fill="#191f26" stroke="#333d4b" stroke-width="1.2"/><text x="200" y="57" text-anchor="middle" class="nl" fill="#b6c1cf">filter</text><text x="200" y="74" text-anchor="middle" class="ns" fill="#8b95a4">idle here</text><path d="M273,30 H375 V88 L367,96 H265 V38 Z" fill="#191f26" stroke="#333d4b" stroke-width="1.2"/><text x="320" y="53" text-anchor="middle" class="nl" fill="#b6c1cf">reminder_</text><text x="320" y="68" text-anchor="middle" class="nl" fill="#b6c1cf">on_token</text><text x="320" y="85" text-anchor="middle" class="ns" fill="#8b95a4">idle here</text><path d="M393,30 H495 V88 L487,96 H385 V38 Z" fill="#191f26" stroke="#333d4b" stroke-width="1.2"/><text x="440" y="57" text-anchor="middle" class="nl" fill="#b6c1cf">lazy_sections</text><text x="440" y="74" text-anchor="middle" class="ns" fill="#8b95a4">idle here</text><path d="M513,30 H615 V88 L607,96 H505 V38 Z" fill="#2a1420" stroke="#8a2a55" stroke-width="1.2"/><text x="560" y="53" text-anchor="middle" class="nl" fill="#ff2e88">recall_</text><text x="560" y="68" text-anchor="middle" class="nl" fill="#ff2e88">injector</text><text x="560" y="85" text-anchor="middle" class="ns" fill="#ff2e88">active</text><path d="M633,30 H735 V88 L727,96 H625 V38 Z" fill="#191f26" stroke="#333d4b" stroke-width="1.2"/><text x="680" y="57" text-anchor="middle" class="nl" fill="#b6c1cf">lessons</text><text x="680" y="74" text-anchor="middle" class="ns" fill="#8b95a4">idle here</text><path d="M753,30 H855 V88 L847,96 H745 V38 Z" fill="#191f26" stroke="#333d4b" stroke-width="1.2"/><text x="800" y="57" text-anchor="middle" class="nl" fill="#b6c1cf">self_identity</text><text x="800" y="74" text-anchor="middle" class="ns" fill="#8b95a4">idle here</text><path d="M873,30 H975 V88 L967,96 H865 V38 Z" fill="#191f26" stroke="#333d4b" stroke-width="1.2"/><text x="920" y="53" text-anchor="middle" class="nl" fill="#b6c1cf">workspace_</text><text x="920" y="68" text-anchor="middle" class="nl" fill="#b6c1cf">briefing</text><text x="920" y="85" text-anchor="middle" class="ns" fill="#8b95a4">idle here</text><path d="M873,200 H975 V258 L967,266 H865 V208 Z" fill="#191f26" stroke="#333d4b" stroke-width="1.2"/><text x="920" y="227" text-anchor="middle" class="nl" fill="#b6c1cf">agent_lessons</text><text x="920" y="244" text-anchor="middle" class="ns" fill="#8b95a4">idle here</text><path d="M753,200 H855 V258 L847,266 H745 V208 Z" fill="#2a1420" stroke="#8a2a55" stroke-width="1.2"/><text x="800" y="227" text-anchor="middle" class="nl" fill="#ff2e88">reminders</text><text x="800" y="244" text-anchor="middle" class="ns" fill="#ff2e88">active</text><path d="M633,200 H735 V258 L727,266 H625 V208 Z" fill="#2a1420" stroke="#8a2a55" stroke-width="1.2"/><text x="680" y="223" text-anchor="middle" class="nl" fill="#ff2e88">steerer</text><text x="680" y="238" text-anchor="middle" class="nl" fill="#ff2e88">+ queue drain</text><text x="680" y="255" text-anchor="middle" class="ns" fill="#ff2e88">active</text><path d="M513,200 H615 V258 L607,266 H505 V208 Z" fill="#2a1420" stroke="#8a2a55" stroke-width="1.2"/><text x="560" y="227" text-anchor="middle" class="nl" fill="#ff2e88">read_dedup</text><text x="560" y="244" text-anchor="middle" class="ns" fill="#ff2e88">active</text><path d="M393,200 H495 V258 L487,266 H385 V208 Z" fill="#191f26" stroke="#333d4b" stroke-width="1.2"/><text x="440" y="223" text-anchor="middle" class="nl" fill="#b6c1cf">file_read_</text><text x="440" y="238" text-anchor="middle" class="nl" fill="#b6c1cf">compression</text><text x="440" y="255" text-anchor="middle" class="ns" fill="#8b95a4">idle here</text><path d="M273,200 H375 V258 L367,266 H265 V208 Z" fill="#191f26" stroke="#333d4b" stroke-width="1.2"/><text x="320" y="227" text-anchor="middle" class="nl" fill="#b6c1cf">proxy_tools</text><text x="320" y="244" text-anchor="middle" class="ns" fill="#8b95a4">idle here</text><path d="M153,200 H255 V258 L247,266 H145 V208 Z" fill="#191f26" stroke="#333d4b" stroke-width="1.2"/><text x="200" y="227" text-anchor="middle" class="nl" fill="#b6c1cf">composer</text><text x="200" y="244" text-anchor="middle" class="ns" fill="#8b95a4">idle here</text><path d="M33,200 H135 V258 L127,266 H25 V208 Z" fill="#1b1f25" stroke="#7a4a3a" stroke-width="1.2"/><text x="80" y="227" text-anchor="middle" class="nl" fill="#d97757">upstream</text><text x="80" y="244" text-anchor="middle" class="ns" fill="#8b95a4">→ Anthropic</text><path d="M33,30 H135 V88 L127,96 H25 V38 Z" fill="none" stroke="#5fe0a0" stroke-width="2" opacity="0"><animate attributeName="opacity" dur="22.6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.013;0.019;0.071;0.077;1"/></path><path d="M153,30 H255 V88 L247,96 H145 V38 Z" fill="none" stroke="#57657a" stroke-width="2" class="glow" style="color:#57657a" opacity="0"><animate attributeName="opacity" dur="22.6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.085;0.088;0.096;0.1;1"/></path><path d="M273,30 H375 V88 L367,96 H265 V38 Z" fill="none" stroke="#57657a" stroke-width="2" class="glow" style="color:#57657a" opacity="0"><animate attributeName="opacity" dur="22.6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.102;0.105;0.113;0.116;1"/></path><path d="M393,30 H495 V88 L487,96 H385 V38 Z" fill="none" stroke=