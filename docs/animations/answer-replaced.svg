<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 694" width="1000" height="694" role="img" aria-labelledby="t d">
<title id="t">mike weasel intercept, animated</title>
<desc id="d">Animated diagram of the buffered forwarder. With weasel intercept armed, the SSE stream from Anthropic is buffered and scanned; a forbidden word produces InterceptSignal::Hit, the buffer is discarded, a correction request with a fresh RequestId is sent upstream, and the second answer is streamed to Claude Code.</desc>
