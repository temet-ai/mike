<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 548" width="960" height="548" role="img" aria-labelledby="t d">
<title id="t">A fleet run on a timeline</title>
<desc id="d">Animated timeline of fleet site-docs from ready to done. mike runs the gate once on a clean copy, opens the status pane, opens the docs template, which reads and closes, then the reference session. Workers for T1 and T2 start together; T1 passes, then T2, and within 20 seconds T3 starts and later passes. mike closes the panes and writes the run record, and the retrospective reads the run.</desc>
<style>
text { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.nl { font-size: 17px; font-weight: 600; }
.ns { font-size: 15px; }
.pl { font-size: 15px; font-weight: 700; paint-order: stroke; stroke: #0e1116; stroke-width: 5px; stroke-linejoin: round; }
.wl { font-size: 14.5px; fill: #b6c1cf; paint-order: stroke; stroke: #0e1116; stroke-width: 5px; }
.eb { font-size: 14.5px; letter-spacing: 2px; fill: #22d9ff; }
.hd { font-family: 'Syne', 'Avenir Next', 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 25px; font-weight: 700; fill: #dae1ea; }
.cn { font-size: 15px; fill: #22d9ff; }
.ct { font-size: 18px; font-weight: 700; fill: #dae1ea; }
.cx { font-size: 16px; fill: #b6c1cf; }
.sm { font-size: 15px; fill: #b6c1cf; }
.xs { font-size: 14.5px; fill: #8b95a4; }
.bt { font-size: 14.5px; font-weight: 700; fill: #0e1116; }
.wire { fill: none; stroke: #57657a; stroke-width: 1.6; stroke-dasharray: 3 5; opacity: 0.7; }
.live { fill: none; stroke-width: 2.4; stroke-dasharray: 8 6; animation: march 0.5s linear infinite; }
.lit { fill: none; stroke-width: 1.8; }
.glow { filter: drop-shadow(0 0 6px currentColor); }
.spin { transform-box: fill-box; transform-origin: center; animation: spin 4s linear infinite; }
@keyframes march { to { stroke-dashoffset: -14; } }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
<path d="M14.5,0.5 H959.5 V533.5 L945.5,547.5 H0.5 V14.5 Z" fill="#0e1116" stroke="#333d4b"/>
<text x="24" y="30" class="eb">MIKE · FLEETS</text>
<text x="24" y="60" class="hd">From ready to done, in order</text>
<g transform="translate(0,76)"><text x="24" y="30" class="sm">mike</text><line x1="190" y1="25" x2="936" y2="25" stroke="#333d4b" stroke-dasharray="2 6"/><text x="24" y="68" class="sm">status pane</text><line x1="190" y1="63" x2="936" y2="63" stroke="#333d4b" stroke-dasharray="2 6"/><text x="24" y="106" class="sm">template</text><line x1="190" y1="101" x2="936" y2="101" stroke="#333d4b" stroke-dasharray="2 6"/><text x="24" y="144" class="sm">reference</text><line x1="190" y1="139" x2="936" y2="139" stroke="#333d4b" stroke-dasharray="2 6"/><text x="24" y="182" class="sm">T1 worker</text><line x1="190" y1="177" x2="936" y2="177" stroke="#333d4b" stroke-dasharray="2 6"/><text x="24" y="220" class="sm">T2 worker</text><line x1="190" y1="215" x2="936" y2="215" stroke="#333d4b" stroke-dasharray="2 6"/><text x="24" y="258" class="sm">T3 worker</text><line x1="190" y1="253" x2="936" y2="253" stroke="#333d4b" stroke-dasharray="2 6"/><text x="24" y="296" class="sm">retrospective</text><line x1="190" y1="291" x2="936" y2="291" stroke="#333d4b" stroke-dasharray="2 6"/><line x1="190" y1="324" x2="936" y2="324" stroke="#57657a"/><line x1="190" y1="319" x2="190" y2="329" stroke="#57657a"/><text x="190" y="348" text-anchor="start" class="xs">ready</text><line x1="900" y1="319" x2="900" y2="329" stroke="#57657a"/><text x="900" y="348" text-anchor="middle" class="xs">done</text><rect x="190" y="14" width="0" height="22" rx="3" fill="#22d9ff" opacity="0.9"><animate attributeName="width" dur="12.2s" repeatCount="indefinite" values="0;0;72;72;0" keyTimes="0;0.049;0.127;0.975;1"/></rect><text x="198" y="30" class="bt" opacity="0">gate<animate attributeName="opacity" dur="12.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.097;0.109;0.963;0.975;1"/></text><text x="270" y="30" text-anchor="start" class="sm" fill="#8b95a4" opacity="0">on a clean copy<animate attributeName="opacity" dur="12.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.127;0.138;0.963;0.975;1"/></text><rect x="834" y="14" width="0" height="22" rx="3" fill="#2ee56b" opacity="0.9"><animate attributeName="width" dur="12.2s" repeatCount="indefinite" values="0;0;66;66;0" keyTimes="0;0.743;0.814;0.975;1"/></rect><text x="842" y="30" class="bt" opacity="0">close<animate attributeName="opacity" dur="12.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.8;0.812;0.963;0.975;1"/></text><rect x="268" y="52" width="0" height="22" rx="3" fill="#57657a" opacity="0.9"><animate attributeName="width" dur="12.2s" repeatCount="indefinite" values="0;0;632;632;0" keyTimes="0;0.133;0.814;0.975;1"/></rect><text x="540" y="68" text-anchor="middle" class="sm" fill="#b6c1cf" opacity="0">mike fleet status<animate attributeName="opacity" dur="12.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.426;0.438;0.963;0.975;1"/></text><rect x="276" y="90" width="0" height="22" rx="3" fill="#b48cff" opacity="0.9"><animate attributeName="width" dur="12.2s" repeatCount="indefinite" values="0;0;80;80;0" keyTimes="0;0.142;0.228;0.975;1"/></rect><text x="284" y="106" class="bt" opacity="0">reads<animate attributeName="opacity" dur="12.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.199;0.211;0.963;0.975;1"/></text><text x="364" y="106" text-anchor="start" class="sm" fill="#8b95a4" opacity="0">closes<animate attributeName="opacity" dur="12.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.228;0.239;0.963;0.975;1"/></text><rect x="362" y="128" width="0" height="22" rx="3" fill="#2f4f86" opacity="1"><animate attributeName="width" dur="12.2s" repeatCount="indefinite" values="0;0;538;538;0" keyTimes="0;0.234;0.814;0.975;1"/></rect><text x="370" y="144" class="bt" opacity="0">answers questions<animate attributeName="opacity" dur="12.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.404;0.416;0.963;0.975;1"/></text><rect x="370" y="166" width="0" height="22" rx="3" fill="#ffc933" opacity="0.9"><animate attributeName="width" dur="12.2s" repeatCount="indefinite" values="0;0;190;190;0" keyTimes="0;0.243;0.448;0.975;1"/></rect><text x="378" y="182" class="bt" opacity="0">working<animate attributeName="opacity" dur="12.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.319;0.331;0.963;0.975;1"/></text><g opacity="0"><animate attributeName="opacity" dur="12.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.448;0.454;0.963;0.97;1"/><rect x="510" y="166" width="50" height="22" rx="3" fill="#2ee56b"/><text x="535" y="182" text-anchor="middle" class="bt">PASS</text></g><rect x="560" y="173" width="0" height="8" rx="3" fill="#57657a" opacity="0.9"><animate attributeName="width" dur="12.2s" repeatCount="indefinite" values="0;0;340;340;0" keyTimes="0;0.448;0.814;0.975;1"/></rect><rect x="370" y="204" width="0" height="22" rx="3" fill="#ffc933" opacity="0.9"><animate attributeName="width" dur="12.2s" repeatCount="indefinite" values="0;0;252;252;0" keyTimes="0;0.243;0.514;0.975;1"/></rect><text x="378" y="220" class="bt" opacity="0">working<animate attributeName="opacity" dur="12.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.319;0.331;0.963;0.975;1"/></text><g opacity="0"><animate attributeName="opacity" dur="12.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.514;0.521;0.963;0.97;1"/><rect x="572" y="204" width="50" height="22" rx="3" fill="#2ee56b"/><text x="597" y="220" text-anchor="middle" class="bt">PASS</text></g><rect x="622" y="211" width="0" height="8" rx="3" fill="#57657a" opacity="0.9"><animate attributeName="width" dur="12.2s" repeatCount="indefinite" values="0;0;278;278;0" keyTimes="0;0.514;0.814;0.975;1"/></rect><path d="M622,226 V253 H646" fill="none" stroke="#b6c1cf" stroke-width="1.4" stroke-dasharray="3 3" opacity="0"><animate attributeName="opacity" dur="12.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.514;0.526;0.963;0.975;1"/></path><text x="616" y="258" text-anchor="end" class="sm" fill="#22d9ff" opacity="0">≤ 20 s<animate attributeName="opacity" dur="12.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.514;0.526;0.963;0.975;1"/></text><rect x="646" y="242" width="0" height="22" rx="3" fill="#ffc933" opacity="0.9"><animate attributeName="width" dur="12.2s" repeatCount="indefinite" values="0;0;166;166;0" keyTimes="0;0.54;0.719;0.975;1"/></rect><text x="654" y="258" class="bt" opacity="0">working<animate attributeName="opacity" dur="12.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.617;0.628;0.963;0.975;1"/></text><g opacity="0"><animate attributeName="opacity" dur="12.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.719;0.725;0.963;0.97;1"/><rect x="762" y="242" width="50" height="22" rx="3" fill="#2ee56b"/><text x="787" y="258" text-anchor="middle" class="bt">PASS</text></g><rect x="812" y="249" width="0" height="8" rx="3" fill="#57657a" opacity="0.9"><animate attributeName="width" dur="12.2s" repeatCount="indefinite" values="0;0;88;88;0" keyTimes="0;0.719;0.814;0.975;1"/></rect><rect x="900" y="280" width="0" height="22" rx="3" fill="#b48cff" opacity="0.9"><animate attributeName="width" dur="12.2s" repeatCount="indefinite" values="0;0;36;36;0" keyTimes="0;0.814;0.852;0.975;1"/></rect><text x="892" y="296" text-anchor="end" class="sm" fill="#b48cff" opacity="0">reads the run<animate attributeName="opacity" dur="12.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.814;0.825;0.963;0.975;1"/></text><g><line x1="0" y1="6" x2="0" y2="324" stroke="#22d9ff" stroke-width="1.6" class="glow" style="color:#22d9ff"/><animateTransform attributeName="transform" type="translate" dur="12.2s" repeatCount="indefinite" values="190,0;190,0;936,0;936,0" keyTimes="0;0.049;0.852;1"/><animate attributeName="opacity" dur="12.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.025;0.036;0.963;0.975;1"/></g></g><line x1="0" y1="440" x2="960" y2="440" stroke="#333d4b"/><g opacity="0"><animate attributeName="opacity" dur="12.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.016;0.028;0.123;0.134;1"/><text x="24" y="471" class="cn">01/06</text><text x="96" y="471" class="ct">The gate runs once, on a clean copy</text><text x="96" y="497" class="cx">Before any worker opens, mike runs the gate command on a clean copy</text><text x="96" y="518" class="cx">of the branch. If it fails, only a named repair task may start.</text></g><g opacity="0"><animate attributeName="opacity" dur="12.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.127;0.138;0.224;0.235;1"/><text x="24" y="471" class="cn">02/06</text><text x="96" y="471" class="ct">Status pane, then the template</text><text x="96" y="497" class="cx">The status pane opens. The docs template reads the rules, its reading</text><text x="96" y="518" class="cx">list and the definition; mike records it and closes its pane.</text></g><g opacity="0"><animate attributeName="opacity" dur="12.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.228;0.239;0.411;0.423;1"/><text x="24" y="471" class="cn">03/06</text><text x="96" y="471" class="ct">Reference session, then T1 and T2</text><text x="96" y="497" class="cx">The reference session opens to answer questions with a file and a line.</text><text x="96" y="518" class="cx">Workers for T1 and T2 start at once, copied from the template.</text></g><g opacity="0"><animate attributeName="opacity" dur="12.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.415;0.427;0.547;0.558;1"/><text x="24" y="471" class="cn">04/06</text><text x="96" y="471" class="ct">T1 and T2 pass; T3 starts within 20 s</text><text x="96" y="497" class="cx">The judge passes T1, then T2. On its next 20-second round</text><text x="96" y="518" class="cx">mike starts a worker for T3, which was waiting for both.</text></g><g opacity="0"><animate attributeName="opacity" dur="12.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.551;0.562;0.728;0.739;1"/><text x="24" y="471" class="cn">05/06</text><text x="96" y="471" class="ct">T3 works and passes</text><text x="96" y="497" class="cx">T3 adds the link check, commits, reports and is judged like the others.</text></g><g opacity="0"><animate attributeName="opacity" dur="12.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.732;0.743;0.971;0.983;1"/><text x="24" y="471" class="cn">06/06</text><text x="96" y="471" class="ct">Close, then the retrospective</text><text x="96" y="497" class="cx">Every task is accepted: mike closes the panes and writes the run record.</text><text x="96" y="518" class="cx">The retrospective session then reads the run and writes its findings.</text></g><rect x="0" y="544" width="0" height="3" fill="#22d9ff" opacity="0.7"><animate attributeName="width" dur="12.2s" repeatCount="indefinite" values="0;960" keyTimes="0;1"/></rect>
</svg>
