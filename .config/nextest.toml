# `timing` is the measurement profile used by `scripts/test-timing`: every
# test, DB group throttled like `ci`, plus a JUnit file (per-test wall time)
# at target/nextest/timing/junit.xml. Not a gate — use `ci` for that.
[profile.timing]
default-filter = "all()"
fail-fast = false

[profile.timing.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true

[[profile.timing.overrides]]
filter = "(package(=mike) | package(=mike-base) | package(=mike-features) | package(=mike-launch) | package(=mike-runtime)) & not (binary(=provider_setup_contracts) | binary(=release_contracts) | binary(=reminder_on_token) | binary(=schema) | ((binary(=mike) | binary(=mike_base) | binary(=mike_features) | binary(=mike_launch) | binary(=mike_runtime)) & test(/^(agents|analysis|anthropic_cli|app|cache_scope|capture|change_log|channel_link_sweep|circuit_breaker|claude|cli|compose_prompt|compress|cross_session|db_listener|diagnostics|doctor|dossier|error|eval::fleet(_[a-z0-9_]+)?|eval_metrics|extract|feature_toggles|filter|fleet|in_flight|injection|launch::fleet::build_admission(_[a-z0-9_]+)?|launch::fleet::checks(_[a-z0-9_]+)?|launch::fleet::events(_[a-z0-9_]+)?|launch::fleet::operation_admission(_[a-z0-9_]+)?|launch::fleet::run_record(_[a-z0-9_]+)?|launch::fleet::tests(_[a-z0-9_]+)?|lazy_sections|llm|logged|mailbox_reaper|mcp_channel|memory_cap|memory_harvester|metrics|observability|owner_only_file|pipeline|proxy_tools|quiescence_worker|read_dedup|reminder_on_token|repeated_notices|resolvers|retention_worker|runtime|semantic|serve|service_token|setup|spa|sse|stack|startup|tui|types|work_items|work_registry_worker::delivery(_[a-z0-9_]+)?|workspace|workspace_reaper)::/)) | (binary(=cli) & test(/^(claude_wrapper|db_fixture_contract|doctor|dotenv_db_url_real_boot|installed_config|local_bind|setup|setup_input|setup_persistence|version)::/)))"
