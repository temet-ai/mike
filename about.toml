# cargo-about (scripts/notices): the licences mike's Rust dependencies may
# use, in the order a choice between several is made. Keep it the same as deny.toml.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "MPL-2.0",
    "Unlicense",
    "CC0-1.0",
    "OpenSSL",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# mike's own crates are MIT (LICENSE) and are not third parties.
[private]
ignore = true
